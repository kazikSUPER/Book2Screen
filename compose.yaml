services:
    db:
        image: postgres:15-alpine
        container_name: project_db
        env_file: ./.env
        environment:
            - POSTGRES_USER=${DB_USER}
            - POSTGRES_PASSWORD=${DB_PASS}
            - POSTGRES_DB=${DB_NAME}
        ports:
            - "5432:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
            interval: 5s
            timeout: 5s
            retries: 5
        networks:
            - project_network

    backend:
        build:
            context: ./server
            dockerfile: Dockerfile
        container_name: project_backend
        env_file: ./.env
        environment:
            - ASPNETCORE_ENVIRONMENT=Development
            - ASPNETCORE_URLS=http://+:8080
            # Force local Docker DB connection
            - DB_CONNECTION_STRING=Host=db;Port=5432;Database=${DB_NAME:-postgres};Username=${DB_USER:-postgres};Password=${DB_PASS:-postgres}
            - JWT_SECRET=${JWT_SECRET}
            - JWT_ISSUER=${JWT_ISSUER}
            - JWT_AUDIENCE=${JWT_AUDIENCE}
            - JWT_EXPIRY_MINUTES=${JWT_EXPIRY_MINUTES}
        depends_on:
            db:
                condition: service_healthy
        healthcheck:
            test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 45s
        ports:
            - "5000:8080"
        networks:
            - project_network

    frontend:
        build:
            context: ./ui
            dockerfile: Dockerfile
            args:
                - VITE_API_URL=${API_URL_EXTERNAL:-http://localhost:5000}
        container_name: project_frontend
        ports:
            - "3000:80"
        depends_on:
            backend:
                condition: service_healthy
        networks:
            - project_network

    pgadmin:
        image: dpage/pgadmin4
        container_name: project_pgadmin
        environment:
            - PGADMIN_DEFAULT_EMAIL=admin@book2screen.com
            - PGADMIN_DEFAULT_PASSWORD=Admin123!
            - PGADMIN_SETUP_EMAIL=admin@book2screen.com
            - PGADMIN_SETUP_PASSWORD=Admin123!
        stdin_open: true
        tty: true
        depends_on:
            db:
                condition: service_healthy
        ports:
            - "5050:80"
        networks:
            - project_network
        volumes:
            - pgadmin_data:/var/lib/pgadmin

networks:
    project_network:
        driver: bridge

volumes:
    pgadmin_data:
  