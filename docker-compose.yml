
version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: book_screen_explorer_db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - app_network

  backend:
    build: .

    container_name: book_screen_explorer_backend

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    env_file:
      - .env

    ports:
      - "3000:3000"

    command: >
      sh -c "
      npm install &&
      npm run migrate &&
      npm run seed &&
      npm run start:dev
      "

    networks:
      - app_network

volumes:
  postgres_data:

networks:
  app_network:
    driver: bridge

