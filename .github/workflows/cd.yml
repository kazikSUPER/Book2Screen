name: CD (Docker Push)

on:
  push:
    branches: [ main, develop ]

jobs:
  push-to-dockerhub:
    name: Build & Push to Docker Hub
    runs-on: ubuntu-latest
    if: github.repository_owner == 'kazikSUPER' # Захист від запуску у форках
    steps:
      - uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/book2screen-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/book2screen-backend:${{ github.sha }}

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./ui
          push: true
          build-args: |
            VITE_API_URL=https://api.book2screen.local
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/book2screen-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/book2screen-frontend:${{ github.sha }}
