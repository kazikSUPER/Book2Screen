name: CD (Docker Push)

on:
  push:
    branches: [ main ] # Deploy only from main

jobs:
  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    # Optional: Run only if CI passes (if they were in the same file or via workflow_run)
    # For simplicity, we run build and test here too or just assume CI passed if we are in main
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/book2screen-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/book2screen-backend:${{ github.sha }}

      - name: Build and push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./ui
          file: ./ui/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/book2screen-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/book2screen-frontend:${{ github.sha }}
