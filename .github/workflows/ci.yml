name: CI (Build & Test)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          # Required for preview/RC versions if net10 is not yet LTS
          dotnet-quality: 'preview'

      - name: Restore dependencies
        run: dotnet restore server/Book2Screen.sln

      - name: Build
        run: dotnet build server/Book2Screen.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test server/Book2Screen.sln --no-build --configuration Release --verbosity normal

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
