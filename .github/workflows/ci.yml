name: CI (Build & Test)

on:
  push:
    branches: [ main, develop, feature/** ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-check:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore server/Book2Screen.sln

      - name: Build
        run: dotnet build server/Book2Screen.sln --no-restore --configuration Release

      - name: Run Tests
        run: dotnet test server/Book2Screen.sln --no-build --configuration Release --verbosity normal

  frontend-check:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        working-directory: ./ui
        run: npm ci

      - name: Lint
        working-directory: ./ui
        run: npm run lint || echo "Lint failed, but continuing for build check"

      - name: Build
        working-directory: ./ui
        run: npm run build
        env:
          VITE_API_URL: "http://localhost:5000"

  docker-check:
    name: Docker Stack Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Stack
        run: docker compose build
